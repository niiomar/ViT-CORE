name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CI runs on CPU-only runners. The default PyPI torch/torchvision wheels
          # drag in the full NVIDIA CUDA toolkit (several GB) that isn't needed here
          # and has previously exhausted the runner's disk ("No space left on device").
          # Install the CPU-only build for exactly the versions pinned in
          # requirements.txt first, then let the rest install normally -- pip sees
          # torch/torchvision already satisfied and skips them.
          pip install --index-url https://download.pytorch.org/whl/cpu \
            $(grep -E '^(torch|torchvision)==' requirements.txt)
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: python -m pytest --cov=. --cov-report=term-missing --cov-fail-under=35

      - name: Smoke-import CLI entry points
        run: python -c "import train, evaluate, predict, model_utils; print('imports ok')"
